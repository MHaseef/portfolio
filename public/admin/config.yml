backend:
  name: github
  repo: MHaseef/portfolio
  branch: main
  base_url: https://decap-cms-oauth-provider-sigma.vercel.app
  auth_endpoint: /auth

local_backend: true



media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "experience"
    label: "Experience Timeline"
    folder: "src/content/experience"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Job Title", name: "title", widget: "string" }
      - { label: "Company", name: "company", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Dates", name: "dates", widget: "string" }
      - { label: "Summary / Teaser", name: "teaser", widget: "text" }
      - { label: "Bullet Points", name: "bullets", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }

  - name: "projects"
    label: "Projects Showcase"
    folder: "src/content/projects"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["WebGIS", "Spatial AI", "Analytics", "Tools"] }
      - { label: "Thumbnail Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Tech Stack / Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Live Demo Link", name: "demoUrl", widget: "string", required: false }
      - { label: "GitHub Link", name: "githubUrl", widget: "string", required: false }
      - { label: "Summary / Teaser", name: "teaser", widget: "text" }
      - { label: "Case Study Problem", name: "problem", widget: "text" }
      - { label: "Case Study Solution & Architecture", name: "solution", widget: "text" }

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["MAPPING", "BACKEND", "SPATIAL AI", "FRONTEND"] }
      - { label: "Read Time", name: "readTime", widget: "string", default: "5 min" }
      - { label: "Cover Image", name: "heroImage", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }