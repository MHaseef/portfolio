backend:
  name: github
  repo: MHaseef/portfolio
  branch: main
  base_url: https://decap-cms-oauth-provider-sigma.vercel.app
  auth_endpoint: /auth

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "skills"
    label: "Skills & Toolkit (Reorder & Edit)"
    files:
      - name: "skills_list"
        label: "Drag handles (=) on right of cards to re-order skills"
        file: "src/content/profile/skills.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Skills List (Drag handle = on right to re-order)"
            name: "skills"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - { label: "Skill Name", name: "name", widget: "string" }
              - { label: "Category", name: "category", widget: "string", default: "Languages & Frameworks" }
              - { label: "Proficiency Level", name: "proficiency", widget: "select", options: ["Expert", "Advanced", "Proficient"], default: "Advanced", required: false }
              - { label: "Skill Logo / SVG Icon Image", name: "icon", widget: "image", required: false, hint: "Upload SVG/PNG icon for this skill tag" }

  - name: "experience"
    label: "Experience Timeline (Reorder & Edit)"
    files:
      - name: "experience_list"
        label: "Drag handles (=) on right of cards to re-order experience"
        file: "src/content/profile/experience.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Experience List (Drag handle = on right to re-order)"
            name: "experience"
            widget: "list"
            summary: "{{fields.title}} — {{fields.company}}"
            fields:
              - { label: "Job Title / Role", name: "title", widget: "string" }
              - { label: "Company / Organization", name: "company", widget: "string", required: false }
              - { label: "Employment Type", name: "type", widget: "string", default: "Full-time", required: false }
              - { label: "Company Logo / Icon Image", name: "logo", widget: "image", required: false }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Start Date", name: "startDate", widget: "string", required: false }
              - { label: "Currently Working Here?", name: "current", widget: "boolean", default: false, required: false }
              - { label: "End Date (or Present)", name: "endDate", widget: "string", required: false }
              - { label: "Dates Summary", name: "dates", widget: "string", required: false }
              - { label: "Summary Teaser", name: "teaser", widget: "text", required: false }
              - { label: "Role Description & Accomplishments (0/2000)", name: "description", widget: "text", required: false }
              - label: "Linked Skills"
                name: "linkedSkills"
                widget: "list"
                required: false
                field: { label: "Skill Tag", name: "skill", widget: "string" }

  - name: "projects"
    label: "Projects Showcase (Reorder & Edit)"
    files:
      - name: "projects_list"
        label: "Drag handles (=) on right of cards to re-order projects"
        file: "src/content/profile/projects.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Projects List (Drag handle = on right to re-order)"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Project Title (Max 255)", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["WebGIS", "Spatial AI", "Analytics", "Tools", "Remote Sensing"] }
              - { label: "Primary Card Thumbnail", name: "thumbnail", widget: "image", required: false }
              - label: "Media Gallery (Screenshots / UI Photos)", name: "mediaGallery", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" }
              - { label: "Summary / Teaser Tagline", name: "teaser", widget: "text", required: false }
              - { label: "Case Study Problem", name: "problem", widget: "text", required: false }
              - { label: "Case Study Solution & Architecture (0/2000)", name: "solution", widget: "text", required: false }
              - { label: "Currently Working on this Project?", name: "current", widget: "boolean", default: false, required: false }
              - { label: "Timeline Dates", name: "dates", widget: "string", required: false }
              - { label: "Live Demo Link", name: "demoUrl", widget: "string", required: false }
              - { label: "GitHub Repo Link", name: "githubUrl", widget: "string", required: false }
              - label: "Utilized Skills / Tags"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "Tag", name: "tag", widget: "string" }
              - label: "Contributors / Profile Links"
                name: "contributors"
                widget: "list"
                required: false
                field: { label: "Contributor", name: "contributor", widget: "string" }

  - name: "blog"
    label: "Blog & Publications (Reorder & Edit)"
    files:
      - name: "blog_list"
        label: "Drag handles (=) on right of cards to re-order blog posts"
        file: "src/content/profile/blog.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Blog Posts List (Drag handle = on right to re-order)"
            name: "blog"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Slug / ID", name: "slug", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Publish Date", name: "date", widget: "string", required: false }
              - { label: "Category", name: "category", widget: "select", options: ["MAPPING", "BACKEND", "SPATIAL AI", "FRONTEND", "TUTORIALS"] }
              - { label: "Read Time", name: "readTime", widget: "string", default: "5 min" }
              - { label: "Cover Image", name: "heroImage", widget: "image", required: false }
              - { label: "Excerpt Summary", name: "excerpt", widget: "text" }
              - { label: "Full Article Content", name: "body", widget: "markdown" }

  - name: "profile"
    label: "Bio, Hero & Education Details"
    delete: false
    files:
      - name: "bio"
        label: "Personal Bio, Hero & Education"
        file: "src/content/profile/bio.json"
        extension: "json"
        format: "json"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - { label: "Profile Picture / Avatar Photo", name: "avatar", widget: "image", required: false }
          - { label: "Initials Avatar (Fallback)", name: "initials", widget: "string" }
          - { label: "Role / Subtitle", name: "role", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Hero Main Headline", name: "heroHeadline", widget: "string", default: "Spatial thinking, engineered.", required: false }
          - { label: "Hero Subtitle / Intro Bio", name: "heroBio", widget: "text", required: false }
          - { label: "Detailed About Me Paragraphs", name: "bioText", widget: "text", required: false }
          - label: "Education Details"
            name: "education"
            widget: "object"
            fields:
              - { label: "Degree / Qualification", name: "degree", widget: "string" }
              - { label: "University / Institution", name: "university", widget: "string" }
              - { label: "Field of Study", name: "fieldOfStudy", widget: "string", required: false }
              - { label: "University Logo / Crest", name: "logo", widget: "image", required: false }
              - { label: "Start Date", name: "startDate", widget: "string", required: false }
              - { label: "End Date / Expected", name: "endDate", widget: "string", required: false }
              - { label: "Dates Summary", name: "dates", widget: "string", required: false }
              - { label: "Grade / Activities & Honors (0/500)", name: "gradeActivities", widget: "text", required: false }
              - { label: "Program Description (0/1000)", name: "description", widget: "text", required: false }

      - name: "contact"
        label: "Contact & Social Links"
        file: "src/content/profile/contact.json"
        extension: "json"
        format: "json"
        fields:
          - { label: "Headline Title", name: "title", widget: "string", default: "Let's build something spatial." }
          - { label: "Primary Email Address", name: "email", widget: "string", required: false }
          - { label: "Location", name: "location", widget: "string", required: false }
          - label: "Contact & Social Links (Drag handle = on right to re-order)"
            name: "socialLinks"
            widget: "list"
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: "Platform / Label", name: "label", widget: "string" }
              - { label: "URL / Link Address", name: "url", widget: "string" }
              - { label: "Display Text", name: "value", widget: "string", required: false }