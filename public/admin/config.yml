backend:
  name: github
  repo: MHaseef/portfolio
  branch: main
  base_url: https://decap-cms-oauth-provider-sigma.vercel.app
  auth_endpoint: /auth

local_backend: true



media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "profile"
    label: "Profile & Bio"
    delete: false
    files:
      - name: "bio"
        label: "Personal Bio & Details"
        file: "src/content/profile/bio.json"
        extension: "json"
        format: "json"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - { label: "Profile Picture / Avatar Photo", name: "avatar", widget: "image", required: false }
          - { label: "Initials Avatar (Fallback)", name: "initials", widget: "string" }
          - { label: "Role / Subtitle", name: "role", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Bio Paragraphs", name: "bio", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
          - label: "Education Details"
            name: "education"
            widget: "object"
            fields:
              - { label: "Degree", name: "degree", widget: "string" }
              - { label: "University / Institution", name: "university", widget: "string" }
              - { label: "University Logo", name: "logo", widget: "image", required: false }
              - { label: "Dates", name: "dates", widget: "string" }
          - { label: "Key Achievements", name: "achievements", widget: "list", field: { label: "Achievement", name: "achievement", widget: "string" } }

      - name: "skills"
        label: "Skills Matrix"
        file: "src/content/profile/skills.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Skills List"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Skill Name", name: "name", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["Languages & Frameworks", "Tools & Platforms"] }
              - { label: "Skill Logo / Icon (Small Round Logo)", name: "icon", widget: "image", required: false }

  - name: "experience"
    label: "Experience Timeline"
    folder: "src/content/experience"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Job Title", name: "title", widget: "string" }
      - { label: "Company Name", name: "company", widget: "string", required: false }
      - { label: "Company Logo", name: "logo", widget: "image", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Dates", name: "dates", widget: "string", required: false }
      - { label: "Summary Tagline", name: "teaser", widget: "text", required: false }
      - { label: "Role Description (LinkedIn-Style Paragraph)", name: "description", widget: "text", required: false }

  - name: "projects"
    label: "Projects Showcase"
    folder: "src/content/projects"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["WebGIS", "Spatial AI", "Analytics", "Tools"] }
      - { label: "Project Media Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Utilized Skills / Tags", name: "tags", widget: "list", required: false, field: { label: "Skill Tag", name: "tag", widget: "string" } }
      - { label: "Live Demo Link (Optional)", name: "demoUrl", widget: "string", required: false }
      - { label: "GitHub Repo Link (Optional)", name: "githubUrl", widget: "string", required: false }
      - { label: "Summary / Teaser Tagline", name: "teaser", widget: "text", required: false }
      - { label: "Case Study Problem", name: "problem", widget: "text", required: false }
      - { label: "Case Study Solution & Architecture", name: "solution", widget: "text", required: false }

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["MAPPING", "BACKEND", "SPATIAL AI", "FRONTEND"] }
      - { label: "Read Time", name: "readTime", widget: "string", default: "5 min" }
      - { label: "Cover Image", name: "heroImage", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }