backend:
  name: github
  repo: MHaseef/portfolio # Your GitHub username/repo
  branch: main # Or main branch
  base_url: https://decap-cms-oauth-provider.vercel.app # Free OAuth backend proxy

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts & Projects"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Category", name: "category", widget: "select", options: ["Web Apps", "Tools & Setup", "Spatial Analysis", "AI & Automation", "Learning Log"] }
      - { label: "Cover Image", name: "heroImage", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }