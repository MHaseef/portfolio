<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — Muhammad Haseef Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* Custom Styling to replicate Admin.dc.html visual layout & dark command-center aesthetic */
      body {
        font-family: 'Source Sans 3', sans-serif !important;
        margin: 0;
        background-color: #F7F6F3 !important;
      }
      /* Decap CMS Sidebar override */
      div[class*="AppHeader"] {
        background-color: #0F2036 !important;
        border-bottom: 1px solid #1C3A57 !important;
      }
      a[class*="AppHeaderNavLink"], span[class*="AppHeaderNav"] {
        font-family: 'JetBrains Mono', monospace !important;
        font-weight: 600 !important;
      }
      aside[class*="SidebarContainer"], div[class*="SidebarContainer"] {
        background-color: #0F2036 !important;
        color: #FFFFFF !important;
      }
      div[class*="SidebarNavGroupTitle"] {
        font-family: 'JetBrains Mono', monospace !important;
        color: #5FA8D3 !important;
      }
      button[class*="Button"] {
        border-radius: 6px !important;
        font-family: 'Source Sans 3', sans-serif !important;
      }
    </style>
  </head>
  <body>
    <!-- Include the main Decap CMS script -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
