<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Haseef — Portfolio Command Center (Admin)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- React 18 & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0B1727;
        color: #E2E8F0;
        min-height: 100vh;
      }
      button { font-family: inherit; cursor: pointer; border: none; }
      input, textarea, select {
        font-family: 'Source Sans 3', sans-serif;
        font-size: 14px;
        background: #112238;
        border: 1px solid #1C3A57;
        color: #F8FAFC;
        border-radius: 6px;
        padding: 10px 14px;
        width: 100%;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus, textarea:focus, select:focus {
        border-color: #1B6FA8;
        box-shadow: 0 0 0 2px rgba(27, 111, 168, 0.25);
      }
      label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 600;
        color: #94A3B8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
        display: block;
      }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        font-family: 'JetBrains Mono', monospace;
      }
      .badge-blue { background: #1B6FA8; color: #FFFFFF; }
      .badge-dark { background: #1C3A57; color: #94A3B8; }
      
      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0B1727; }
      ::-webkit-scrollbar-thumb { background: #1C3A57; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #1B6FA8; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Top Admin Navigation Header
      const Header = ({ user, onLogout }) => (
        <header style={{
          background: '#070F1E',
          borderBottom: '1px solid #1C3A57',
          padding: '12px 28px',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          position: 'sticky',
          top: 0,
          zIndex: 100,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
            <div style={{
              background: '#1B6FA8',
              color: '#FFF',
              fontFamily: "'JetBrains Mono', monospace",
              fontWeight: 700,
              padding: '6px 12px',
              borderRadius: '6px',
              fontSize: '13px',
              letterSpacing: '1px'
            }}>
              ⚡ MUHAMMAD HASEEF
            </div>
            <span style={{
              color: '#64748B',
              fontSize: '13px',
              fontFamily: "'JetBrains Mono', monospace"
            }}>
              / Admin Command Center
            </span>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
            {user && (
              <span style={{ fontSize: '13px', color: '#94A3B8' }}>
                Status: <strong style={{ color: '#34D399' }}>✓ Authenticated Admin</strong>
              </span>
            )}
            <a 
              href="/" 
              target="_blank" 
              rel="noreferrer"
              style={{
                color: '#38BDF8',
                textDecoration: 'none',
                fontSize: '13px',
                fontWeight: 600,
                padding: '6px 14px',
                borderRadius: '6px',
                background: 'rgba(56, 189, 248, 0.1)',
                border: '1px solid rgba(56, 189, 248, 0.2)',
                transition: 'all 0.2s'
              }}
            >
              View Live Site ↗
            </a>
            {user && (
              <button 
                onClick={onLogout}
                style={{
                  background: '#EF4444',
                  color: '#FFF',
                  fontSize: '13px',
                  fontWeight: 600,
                  padding: '6px 14px',
                  borderRadius: '6px',
                }}
              >
                Logout
              </button>
            )}
          </div>
        </header>
      );

      // Login Shield Component using Vercel OAuth provider
      const LoginShield = ({ onGitHubLogin }) => (
        <div style={{
          minHeight: '85vh',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          padding: '20px'
        }}>
          <div style={{
            background: '#0F2036',
            border: '1px solid #1C3A57',
            borderRadius: '16px',
            padding: '44px',
            maxWidth: '480px',
            width: '100%',
            textAlign: 'center',
            boxShadow: '0 20px 40px rgba(0,0,0,0.5)'
          }}>
            <div style={{ fontSize: '48px', marginBottom: '16px' }}>🔐</div>
            <h2 style={{ fontFamily: "'JetBrains Mono', monospace", color: '#F8FAFC', marginBottom: '12px' }}>
              Admin Access Required
            </h2>
            <p style={{ color: '#94A3B8', fontSize: '14px', lineHeight: 1.6, marginBottom: '28px' }}>
              Authenticate with your GitHub admin account via your Vercel OAuth provider to manage your portfolio content.
            </p>
            
            <button
              onClick={onGitHubLogin}
              style={{
                width: '100%',
                background: '#24292F',
                color: '#FFFFFF',
                fontWeight: 700,
                fontSize: '15px',
                padding: '14px',
                borderRadius: '8px',
                border: '1px solid #38434D',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                gap: '10px',
                boxShadow: '0 4px 14px rgba(0, 0, 0, 0.4)',
                transition: 'background 0.2s'
              }}
            >
              <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
              </svg>
              Log in with GitHub
            </button>
          </div>
        </div>
      );

      // Toast Notification Component
      const Toast = ({ toast }) => {
        if (!toast) return null;
        const isError = toast.type === 'error';
        return (
          <div style={{
            position: 'fixed',
            bottom: '24px',
            right: '24px',
            zIndex: 1000,
            background: isError ? '#7F1D1D' : '#065F46',
            color: '#FFFFFF',
            border: `1px solid ${isError ? '#F87171' : '#34D399'}`,
            borderRadius: '8px',
            padding: '12px 20px',
            boxShadow: '0 10px 25px rgba(0,0,0,0.4)',
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: '13px',
            display: 'flex',
            alignItems: 'center',
            gap: '10px'
          }}>
            <span>{isError ? '⚠️' : '✅'}</span>
            <span>{toast.message}</span>
          </div>
        );
      };

      // File Dropzone Component
      const FileDropzone = ({ label, currentUrl, onUploadComplete }) => {
        const [uploading, setUploading] = useState(false);

        const handleFileChange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          setUploading(true);
          try {
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.url) {
              onUploadComplete(data.url);
            } else {
              alert(data.error || 'Upload failed');
            }
          } catch (err) {
            alert('Upload failed: ' + err.message);
          } finally {
            setUploading(false);
          }
        };

        return (
          <div style={{ marginBottom: '16px' }}>
            <label>{label}</label>
            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: '14px',
              background: '#112238',
              border: '1px dashed #1C3A57',
              borderRadius: '8px',
              padding: '12px 16px'
            }}>
              {currentUrl ? (
                <img src={currentUrl} alt="Preview" style={{ width: '44px', height: '44px', objectFit: 'cover', borderRadius: '6px' }} />
              ) : (
                <div style={{ width: '44px', height: '44px', background: '#0B1727', borderRadius: '6px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#64748B', fontSize: '20px' }}>🖼️</div>
              )}
              <div style={{ flex: 1 }}>
                <input 
                  type="text" 
                  value={currentUrl || ''} 
                  onChange={(e) => onUploadComplete(e.target.value)} 
                  placeholder="Paste URL or upload image file..."
                  style={{ marginBottom: '6px' }}
                />
                <input type="file" onChange={handleFileChange} disabled={uploading} style={{ fontSize: '12px', padding: '4px' }} />
              </div>
              {uploading && <span style={{ fontSize: '12px', color: '#38BDF8' }}>Uploading...</span>}
            </div>
          </div>
        );
      };

      // Reorder Modal Component (↕ Section Reordering)
      const ReorderModal = ({ isOpen, title, items, keyField = 'id', labelField = 'title', onClose, onSave }) => {
        if (!isOpen) return null;
        const [list, setList] = useState([...items]);

        const moveItem = (index, direction) => {
          const newList = [...list];
          const targetIndex = index + direction;
          if (targetIndex < 0 || targetIndex >= newList.length) return;
          const temp = newList[index];
          newList[index] = newList[targetIndex];
          newList[targetIndex] = temp;
          setList(newList);
        };

        return (
          <div style={{
            position: 'fixed', inset: 0, zIndex: 500,
            background: 'rgba(5, 11, 20, 0.8)',
            backdropFilter: 'blur(4px)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px'
          }}>
            <div style={{
              background: '#0F2036', border: '1px solid #1C3A57', borderRadius: '14px',
              padding: '28px', maxWidth: '560px', width: '100%', maxHeight: '85vh', display: 'flex', flexDirection: 'column'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                <h3 style={{ fontFamily: "'JetBrains Mono', monospace", color: '#F8FAFC', fontSize: '18px' }}>
                  ↕ Reorder {title}
                </h3>
                <button onClick={onClose} style={{ background: 'transparent', color: '#94A3B8', fontSize: '20px' }}>✕</button>
              </div>
              <p style={{ color: '#94A3B8', fontSize: '13px', marginBottom: '16px' }}>
                Use the Up (▲) and Down (▼) buttons to adjust the order of items as they appear on your site.
              </p>

              <div style={{ flex: 1, overflowY: 'auto', paddingRight: '6px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {list.map((item, idx) => (
                  <div key={item[keyField] || idx} style={{
                    background: '#112238', border: '1px solid #1C3A57', borderRadius: '8px',
                    padding: '10px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between'
                  }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                      <span style={{ color: '#64748B', fontFamily: "'JetBrains Mono', monospace", fontSize: '12px', width: '20px' }}>
                        #{idx + 1}
                      </span>
                      <span style={{ fontWeight: 600, color: '#F8FAFC', fontSize: '14px' }}>
                        {item[labelField] || item.name || item.title || 'Untitled'}
                      </span>
                    </div>

                    <div style={{ display: 'flex', gap: '6px' }}>
                      <button 
                        onClick={() => moveItem(idx, -1)} 
                        disabled={idx === 0}
                        style={{
                          background: idx === 0 ? '#0B1727' : '#1C3A57',
                          color: idx === 0 ? '#475569' : '#FFF',
                          padding: '6px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: 700
                        }}
                      >
                        ▲ Up
                      </button>
                      <button 
                        onClick={() => moveItem(idx, 1)} 
                        disabled={idx === list.length - 1}
                        style={{
                          background: idx === list.length - 1 ? '#0B1727' : '#1C3A57',
                          color: idx === list.length - 1 ? '#475569' : '#FFF',
                          padding: '6px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: 700
                        }}
                      >
                        ▼ Down
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '24px', pt: '16px', borderTop: '1px solid #1C3A57' }}>
                <button onClick={onClose} style={{ background: 'transparent', color: '#94A3B8', padding: '10px 18px' }}>Cancel</button>
                <button onClick={() => onSave(list)} style={{ background: '#1B6FA8', color: '#FFF', padding: '10px 24px', borderRadius: '6px', fontWeight: 700 }}>
                  Save New Order
                </button>
              </div>
            </div>
          </div>
        );
      };

      // Main Admin Command Center Application
      const AdminApp = ({ user, onLogout }) => {
        const [activeTab, setActiveTab] = useState('overview');
        const [loading, setLoading] = useState(true);
        const [toast, setToast] = useState(null);

        // Data state
        const [bio, setBio] = useState({});
        const [projects, setProjects] = useState([]);
        const [skills, setSkills] = useState([]);
        const [experience, setExperience] = useState([]);
        const [blog, setBlog] = useState([]);
        const [contact, setContact] = useState({});

        // Modal states
        const [reorderModal, setReorderModal] = useState({ isOpen: false, section: '', items: [] });
        const [editModal, setEditModal] = useState({ isOpen: false, type: '', item: null });

        const showToast = (message, type = 'success') => {
          setToast({ message, type });
          setTimeout(() => setToast(null), 3500);
        };

        const fetchAllData = async () => {
          setLoading(true);
          try {
            const [bioRes, projRes, skillRes, expRes, blogRes, contactRes] = await Promise.all([
              fetch('/api/profile').then(r => r.json()),
              fetch('/api/projects').then(r => r.json()),
              fetch('/api/skills').then(r => r.json()),
              fetch('/api/experience').then(r => r.json()),
              fetch('/api/blog').then(r => r.json()),
              fetch('/api/contact').then(r => r.json()),
            ]);
            setBio(bioRes || {});
            setProjects(projRes.projects || []);
            setSkills(skillRes.skills || []);
            setExperience(expRes.experience || []);
            setBlog(blogRes.blog || []);
            setContact(contactRes || {});
          } catch (err) {
            showToast('Failed to load portfolio data: ' + err.message, 'error');
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          fetchAllData();
        }, []);

        // Delete handler
        const handleDelete = async (apiEndpoint, queryParam, value, sectionName) => {
          if (!confirm(`Are you sure you want to delete this ${sectionName} item?`)) return;
          try {
            const res = await fetch(`${apiEndpoint}?${queryParam}=${encodeURIComponent(value)}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.success) {
              showToast(`Item deleted from ${sectionName}`);
              fetchAllData();
            } else {
              showToast(result.error || 'Delete failed', 'error');
            }
          } catch (err) {
            showToast('Error deleting item: ' + err.message, 'error');
          }
        };

        // Reorder Save Handler
        const handleSaveOrder = async (section, reorderedList) => {
          try {
            const endpointMap = {
              projects: '/api/projects',
              skills: '/api/skills',
              experience: '/api/experience',
              blog: '/api/blog',
            };
            const res = await fetch(endpointMap[section], {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ reorder: reorderedList }),
            });
            const data = await res.json();
            if (data.success) {
              showToast(`Updated ${section} order successfully`);
              setReorderModal({ isOpen: false, section: '', items: [] });
              fetchAllData();
            } else {
              showToast(data.error || 'Reorder failed', 'error');
            }
          } catch (err) {
            showToast('Reorder save error: ' + err.message, 'error');
          }
        };

        // Form Submit Handler
        const handleSaveItem = async (type, itemData) => {
          try {
            const endpointMap = {
              profile: '/api/profile',
              project: '/api/projects',
              skill: '/api/skills',
              experience: '/api/experience',
              blog: '/api/blog',
              contact: '/api/contact',
            };

            const res = await fetch(endpointMap[type], {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(itemData),
            });
            const data = await res.json();
            if (data.success || data.bio || data.contact) {
              showToast(`${type.toUpperCase()} saved successfully`);
              setEditModal({ isOpen: false, type: '', item: null });
              fetchAllData();
            } else {
              showToast(data.error || 'Save failed', 'error');
            }
          } catch (err) {
            showToast('Save error: ' + err.message, 'error');
          }
        };

        return (
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
            <Header user={user} onLogout={onLogout} />
            <Toast toast={toast} />

            <div style={{ flex: 1, display: 'flex' }}>
              {/* Sidebar */}
              <aside style={{
                width: '260px',
                background: '#091322',
                borderRight: '1px solid #1C3A57',
                padding: '24px 16px',
                display: 'flex',
                flexDirection: 'column',
                gap: '6px'
              }}>
                <div style={{
                  fontSize: '11px',
                  fontFamily: "'JetBrains Mono', monospace",
                  color: '#1B6FA8',
                  letterSpacing: '1.5px',
                  marginBottom: '10px',
                  paddingLeft: '12px'
                }}>
                  NAVIGATION SECTIONS
                </div>

                {[
                  { id: 'overview', label: '📊 Dashboard Overview' },
                  { id: 'profile', label: '👤 Profile & Bio' },
                  { id: 'skills', label: `🛠️ Skills (${skills.length})` },
                  { id: 'experience', label: `💼 Experience (${experience.length})` },
                  { id: 'projects', label: `💻 Projects (${projects.length})` },
                  { id: 'blog', label: `📝 Blog (${blog.length})` },
                  { id: 'contact', label: '📬 Contact Info' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    style={{
                      textAlign: 'left',
                      padding: '12px 16px',
                      borderRadius: '8px',
                      fontSize: '14px',
                      fontWeight: 600,
                      color: activeTab === tab.id ? '#FFFFFF' : '#94A3B8',
                      background: activeTab === tab.id ? '#1B6FA8' : 'transparent',
                      transition: 'all 0.15s ease'
                    }}
                  >
                    {tab.label}
                  </button>
                ))}
              </aside>

              {/* Main Workspace */}
              <main style={{ flex: 1, padding: '36px 44px', background: '#0B1727', overflowY: 'auto' }}>
                {loading ? (
                  <div style={{ textAlign: 'center', padding: '80px 0', color: '#94A3B8' }}>
                    <div style={{ fontSize: '32px', marginBottom: '12px' }}>🔄</div>
                    <p style={{ fontFamily: "'JetBrains Mono', monospace" }}>Loading portfolio command center data...</p>
                  </div>
                ) : (
                  <>
                    {/* TAB: OVERVIEW */}
                    {activeTab === 'overview' && (
                      <div>
                        <div style={{
                          background: 'linear-gradient(135deg, #0F2036 0%, #162C46 100%)',
                          border: '1px solid #1C3A57', borderRadius: '16px', padding: '32px', marginBottom: '32px'
                        }}>
                          <h2 style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '26px', color: '#F8FAFC', marginBottom: '8px' }}>
                            Welcome back, Haseef 👋
                          </h2>
                          <p style={{ color: '#94A3B8', fontSize: '15px', lineHeight: 1.6 }}>
                            This is your portfolio command center. Use the sidebar tabs to modify content, upload new media assets, and reorder sections.
                          </p>
                        </div>

                        {/* Stat Cards */}
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '20px', marginBottom: '40px' }}>
                          {[
                            { title: 'Total Projects', count: projects.length, icon: '💻', tab: 'projects' },
                            { title: 'Total Skills', count: skills.length, icon: '🛠️', tab: 'skills' },
                            { title: 'Experience Entries', count: experience.length, icon: '💼', tab: 'experience' },
                            { title: 'Published Posts', count: blog.length, icon: '📝', tab: 'blog' },
                          ].map((stat, i) => (
                            <div 
                              key={i} 
                              onClick={() => setActiveTab(stat.tab)}
                              style={{
                                background: '#0F2036', border: '1px solid #1C3A57', borderRadius: '12px',
                                padding: '24px', cursor: 'pointer', transition: 'transform 0.2s'
                              }}
                            >
                              <div style={{ fontSize: '28px', marginBottom: '10px' }}>{stat.icon}</div>
                              <div style={{ fontSize: '32px', fontWeight: 700, color: '#F8FAFC', fontFamily: "'JetBrains Mono', monospace" }}>{stat.count}</div>
                              <div style={{ color: '#94A3B8', fontSize: '13px', fontWeight: 600, marginTop: '4px' }}>{stat.title}</div>
                            </div>
                          ))}
                        </div>

                        {/* Quick Actions */}
                        <h3 style={{ fontFamily: "'JetBrains Mono', monospace", color: '#F8FAFC', marginBottom: '16px' }}>Quick Actions</h3>
                        <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap' }}>
                          <button onClick={() => setEditModal({ isOpen: true, type: 'project', item: null })} style={{ background: '#1B6FA8', color: '#FFF', padding: '12px 20px', borderRadius: '8px', fontWeight: 700 }}>+ Add New Project</button>
                          <button onClick={() => setEditModal({ isOpen: true, type: 'skill', item: null })} style={{ background: '#1B6FA8', color: '#FFF', padding: '12px 20px', borderRadius: '8px', fontWeight: 700 }}>+ Add New Skill</button>

                      <div>
                        <label>Read Time</label>
                        <input type="text" value={form.readTime || '5 min'} onChange={e => setForm({ ...form, readTime: e.target.value })} />
                      </div>
                    </div>
                    <div>
                      <label>Excerpt Summary</label>
                      <textarea rows="2" value={form.excerpt || ''} onChange={e => setForm({ ...form, excerpt: e.target.value })} />
                    </div>
                    <div>
                      <label>Full Article Body (Markdown supported)</label>
                      <textarea rows="8" value={form.body || ''} onChange={e => setForm({ ...form, body: e.target.value })} />
                    </div>
                  </>
                )}

                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '16px' }}>
                  <button type="button" onClick={onClose} style={{ background: 'transparent', color: '#94A3B8', padding: '10px 18px' }}>Cancel</button>
                  <button type="submit" style={{ background: '#1B6FA8', color: '#FFF', padding: '10px 24px', borderRadius: '6px', fontWeight: 700 }}>
                    Save {type.toUpperCase()}
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      };

      // Root App Container & OAuth Listener
      const Root = () => {
        const [user, setUser] = useState(null);

        useEffect(() => {
          // Check existing session
          const savedToken = localStorage.getItem('admin_auth_token');
          if (savedToken) {
            setUser({ token: savedToken, role: 'admin' });
          }

          // Listen for GitHub OAuth postMessage callback
          const handleAuthMessage = (event) => {
            if (typeof event.data === 'string' && event.data.includes('authorization:github:success')) {
              try {
                const match = event.data.match(/authorization:github:success:(.*)/);
                if (match && match[1]) {
                  const data = JSON.parse(match[1]);
                  const token = data.token;
                  localStorage.setItem('admin_auth_token', token);
                  setUser({ token: token, role: 'admin' });
                }
              } catch (e) {
                console.error('OAuth parse error:', e);
              }
            }
          };

          window.addEventListener('message', handleAuthMessage);
          return () => window.removeEventListener('message', handleAuthMessage);
        }, []);

        const handleGitHubLogin = () => {
          const authUrl = 'https://decap-cms-oauth-provider-sigma.vercel.app/auth?scope=repo';
          const width = 600, height = 700;
          const left = window.screen.width / 2 - width / 2;
          const top = window.screen.height / 2 - height / 2;
          window.open(authUrl, 'github_oauth', `width=${width},height=${height},top=${top},left=${left}`);
        };

        const handleLogout = () => {
          localStorage.removeItem('admin_auth_token');
          setUser(null);
        };

        if (!user) {
          return (
            <div>
              <Header user={null} />
              <LoginShield onGitHubLogin={handleGitHubLogin} />
            </div>
          );
        }

        return <AdminApp user={user} onLogout={handleLogout} />;
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
  </body>
</html>
